name: Build Antigravity Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licences: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Bundle Android Assets
        run: |
          mkdir -p android/app/src/main/assets/gateway
          cp -r src android/app/src/main/assets/gateway/

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/AntigravityGateway-Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityGateway-Debug-APK
          path: dist/AntigravityGateway-Debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0-native
          name: "Antigravity Gateway Native v3.0.0"
          body: |
            ## 🚀 Antigravity Gateway Native (v3.0.0) 终极原生商业版
            - 彻底重构：完全移除脆弱的 WebView 网页层，100% Android 原生控件开发，点击秒响应！
            - 独立隔离：买家的 Google 凭据仅存储在买家手机本地 SharedPreferences，零云端泄露，零共用风险！
            - 商业授权：内置一卡一号强绑定鉴权，买家激活卡密即刻与该账号绑定！
            - Chrome 定向拉起：原生 Intent 唤醒系统 Chrome 浏览器，支持一键复制授权网址！
            - 实时配额：原生呈现 5小时爆发窗口 + 7天周度窗口双重可用配额！
          files: dist/AntigravityGateway-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
