name: Build Antigravity Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licences: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Bundle Android Assets
        run: |
          mkdir -p android/app/src/main/assets/gateway
          cp -r src android/app/src/main/assets/gateway/

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/AntigravityGateway-Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityGateway-Debug-APK
          path: dist/AntigravityGateway-Debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4-pro
          name: "Antigravity Gateway Pro v2.0.0"
          body: |
            ## 🚀 Antigravity Gateway Pro (v2.0.0)
            - 版本升级：versionCode 2 (v2.0.0)，支持直接覆盖安装，免卸载
            - 账号隔离：彻底解决多账号数据串通问题，各账号配额/日志完全独立
            - 双重配额：完整支持 5小时滑动窗口 + 7天周度窗口双重展示与重置提醒
            - 浏览器唤醒：优先定向唤醒 Chrome 官方浏览器，支持手动复制授权链接兜底
            - 极简授权：一密钥绑一账号商业卡密体系
          files: dist/AntigravityGateway-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
