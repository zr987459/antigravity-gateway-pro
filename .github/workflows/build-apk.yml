name: Build Antigravity Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: cimg/android:2024.01.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bundle Android Assets
        run: |
          mkdir -p android/app/src/main/assets/gateway
          cp -r src android/app/src/main/assets/gateway/

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/AntigravityGateway-Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityGateway-Debug-APK
          path: dist/AntigravityGateway-Debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3-app
          name: "Antigravity Gateway Android App v2.3 (Local Pro)"
          body: |
            ## 🚀 Antigravity Gateway 独立安卓客户端 (v2.3)
            - 纯本地运行设计，支持自定义本地网关端口与 API 密钥一键随机生成
            - 授权登录自动唤醒系统外部浏览器，完美解决 Google 403 拦截
            - 极简小圆圈悬浮球（支持磁吸边缘、拖动、展开快捷菜单：主页/刷新/关闭）
          files: dist/AntigravityGateway-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
